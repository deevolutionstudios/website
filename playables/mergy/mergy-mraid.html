    if (!other) { pc.r = cell[0]; pc.c = cell[1]; }
  }
  hintAt = t + 50; hint = 'drag'; guide = pickPair();   // back to its square; the finger shows a pair again soon
});
function merge(a, b) {
  a.gone = true; b.v++; b.pop = 1.25; score++; merges++; idleT = 0;
  chime(merges);
  const cx = cellX(b.c) + CS / 2, cy = cellY(b.r) + CS / 2;
  popups.push({ x: cx, y: cy - CS * 0.45, txt: '+1', life: 50 });
  for (let i = 0; i < 10; i++) { const an = Math.random() * 6.28, sp = 0.6 + Math.random() * 1.4; fx.push({ x: cx, y: cy, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: 36, c: ['#ffd27a', '#fff3d6', '#e9a6ff'][i % 3] }); }
  pieces = pieces.filter(p => !p.gone);
  if (pieces.length <= 1) { hint = null; setTimeout(finish, 1300); return; }
  guide = pickPair(); hint = 'drag'; hintAt = t + 45;
}
function finish() {
  if (ended) return; ended = true;
  document.getElementById('end').classList.add('on');
  send('complete', { score });
}
document.getElementById('cta').addEventListener('click', e => { e.stopPropagation(); cta(); });
document.getElementById('end').addEventListener('click', cta);

// ---- drawing
function step() {
  t++; idleT++;
  for (const p of pieces) { if (p === (drag && drag.pc)) continue; p.x += (cellX(p.c) - p.x) * 0.25; p.y += (cellY(p.r) - p.y) * 0.25; p.pop += (1 - p.pop) * 0.12; }
  fx = fx.filter(p => (p.x += p.vx, p.y += p.vy, p.vy += 0.03, --p.life > 0));
  popups = popups.filter(p => (p.y -= 0.4, --p.life > 0));
  if (!ended && started && idleT > 60 * 12) finish();
  if (!started && t > 60 * 15) finish();
}
function text(s, x, y, size, fill, stroke) {
  g.font = `900 ${size}px "Trebuchet MS",Arial,sans-serif`; g.textAlign = 'center'; g.lineJoin = 'round';
  g.lineWidth = Math.max(4, size / 5); g.strokeStyle = stroke || '#4a2240'; g.strokeText(s, x, y); g.fillStyle = fill || '#fff'; g.fillText(s, x, y);
}
function draw() {
  g.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  g.fillStyle = '#3a1e14'; g.fillRect(0, 0, W, H);
  const bg = img.bg;
  if (bg.width) { const k = Math.max(W / bg.width, H / bg.height), w = bg.width * k, h = bg.height * k; g.drawImage(bg, (W - w) / 2, (H - h) / 2, w, h); }
  g.fillStyle = 'rgba(30,14,40,.32)'; g.fillRect(0, 0, W, H);
  // what it is, at a glance
  text('MERGY', W / 2, BY - 168, 30, '#ffd27a');
  text('a cozy merge game', W / 2, BY - 143, 17, '#fff');
  // merges so far
  text(`${score} ${score === 1 ? 'merge' : 'merges'}`, W / 2, BY - 100, 24, '#fff');
  // the board, Mergy the cat asleep on its top edge
  if (img.board.width) g.drawImage(img.board, BX, BY, BS, BS);
  if (img.cat.width) { const cw = BS * 0.3, ch = cw * img.cat.height / img.cat.width; g.drawImage(img.cat, W / 2 - cw / 2, BY - ch * 0.86, cw, ch); }
  const order = pieces.slice().sort((a, b) => (a.lift || 0) - (b.lift || 0));
  for (const p of order) {
    const im = img[LINE[p.v]]; if (!im || !im.width) continue;
    const s = CS * 0.86 * p.pop * (p.lift ? 1.12 : 1), cx = p.x + CS / 2, cy = p.y + CS / 2;
    g.drawImage(im, cx - s / 2, cy - s / 2, s, s);
  }
  for (const p of fx) { g.globalAlpha = Math.min(1, p.life / 16); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, 2.8, 0, 6.29); g.fill(); }
  g.globalAlpha = 1;
  for (const p of popups) { g.globalAlpha = Math.min(1, p.life / 20); text(p.txt, p.x, p.y, 22, '#ffd27a'); }
  g.globalAlpha = 1;
  // the hint: the words, and the finger dragging one piece slowly onto its twin
  if (hint === 'drag' && t >= hintAt && guide) {
    text(merges ? 'KEEP MERGING!' : 'DRAG TWO THE SAME TOGETHER', W / 2, BY + BS + 32, merges ? 22 : 18, '#fff');
    const [a, b] = guide, P = 150, k = ((t - hintAt) % P) / P, glide = Math.min(1, Math.max(0, (k - 0.12) / 0.5)), e = glide * glide * (3 - 2 * glide);
    const al = k < 0.12 ? k / 0.12 : k < 0.62 ? 1 : k < 0.76 ? 1 - (k - 0.62) / 0.14 : 0;
    const ax = cellX(a.c) + CS / 2, ay = cellY(a.r) + CS / 2, bx = cellX(b.c) + CS / 2, by = cellY(b.r) + CS / 2;
    const hx = ax + (bx - ax) * e, hy = ay + (by - ay) * e;
    if (al > 0) {
      g.save(); g.globalAlpha = al * 0.55; const im = img[LINE[a.v]]; if (im.width) g.drawImage(im, hx - CS * 0.36, hy - CS * 0.36, CS * 0.72, CS * 0.72);
      g.globalAlpha = al; g.font = '44px sans-serif'; g.textAlign = 'center'; g.fillText('\u{1F446}', hx + 8, hy + 40); g.restore();
    }
  }
}
// the rules run at a steady 60 steps a second; pieces are drawn between steps so 120 Hz screens stay smooth
let last = 0, acc = 0, blend = null, fpsCount = 0, fpsAt = 0;
const verEl = document.getElementById('ver'), BUILD = verEl.textContent;   // the build tag, then frames drawn per second (for testing)
function loop(now) {
  if (!last) last = now;
  acc = Math.min(acc + (now - last), 250); last = now;
  let prev = null;
  while (acc >= 1000 / 60) { prev = new Map(pieces.map(o => [o, [o.x, o.y]])); step(); acc -= 1000 / 60; }
  if (prev) blend = prev;
  const a = acc / (1000 / 60), keep = new Map(pieces.map(o => [o, [o.x, o.y]]));
  if (blend) for (const o of pieces) { if (drag && o === drag.pc) continue; const p = blend.get(o); if (p) { o.x = p[0] + (o.x - p[0]) * a; o.y = p[1] + (o.y - p[1]) * a; } }
  draw(); fpsCount++;
  if (now - fpsAt >= 1000) { verEl.textContent = BUILD + ' · ' + fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
  for (const [o, p] of keep) { o.x = p[0]; o.y = p[1]; }
  requestAnimationFrame(loop);
}
</script>
