  canvas{display:block;width:100%;height:100%}
  #end{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;
    background:radial-gradient(circle at 50% 40%,rgba(255,170,220,.35),rgba(20,40,40,.88) 70%);font-family:'Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif;color:#fff;text-align:center}
  #end.on{display:flex;animation:fade .35s ease-out}

  #end button{margin-top:4px;border:3px solid #fff;border-radius:999px;background:linear-gradient(#ff7fcb,#e23d9b);color:#fff;font:900 clamp(20px,6.2vw,26px)/1 'Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif;
    padding:16px 40px;box-shadow:0 6px 0 #9c1d63,0 10px 20px rgba(0,0,0,.35);letter-spacing:.5px;animation:pulse 1.1s ease-in-out infinite;cursor:pointer}
  #end .sub{font-size:13px;opacity:.85}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes bob{50%{transform:translateY(-8px)}}
  @keyframes pulse{50%{transform:scale(1.07)}}
  @media (prefers-reduced-motion:reduce){#end img.pose,#end button{animation:none}}
</style>

const WATER = () => H * 0.84;

function step() {

  play('splash', 0.6);
  for (let i = 0; i < 24; i++) { const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, s = 2 + Math.random() * 3; fx.push({ x: candi.x, y: WATER(), vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 40, c: i % 2 ? '#bff3e6' : '#fff' }); }
  popups.push({ x: candi.x, y: WATER() - 60, txt: 'SPLASH!', c: '#bff3e6', life: 60 });
}
function finish() {
  if (ended) return; ended = true; holding = false;
  document.getElementById('endline').textContent = hops >= 1 ? `You scored ${score}! Can you go further?` : 'Help Candi cross the swamp!';
  document.getElementById('end').classList.add('on');
  send('complete', { score });
}

// ---- drawing
function cover(im, y, h, par) {
  if (!im.width) return;
  const w = h * im.width / im.height, off = -((cam * par) % w);
  for (let x = off - w; x < W + w; x += w) g.drawImage(im, x, y, w + 1, h);
}
function frameIndex() {
  const m = candi.mode;
  if (m === 'fly') return FR.fly[Math.min(candi.frame, 3)];
  if (m === 'drift' || m === 'slide') return FR.fall[candi.frame % 2];
  if (m === 'run') return FR.run[candi.frame % 4];
  if (m === 'sink') return FR.splash[Math.min(candi.frame, 2)];
  return FR.stand;
}
function drawCandi() {
  const i = frameIndex(), x = candi.x - cam;
  g.save();
  if (candi.mode === 'sink') { g.beginPath(); g.rect(-50, -50, W + 100, WATER() + 52); g.clip(); }
  g.drawImage(img.candi, i * 138, 0, 138, 136, x - CW / 2, candi.y - CH, CW, CH);
  g.restore();
}
function drawStump(s) {
  const im = img[s.img]; if (!im.width) return;
  const w = s.w * 1.35, h = w * im.height / im.width, x = s.x - cam - w / 2;
  g.drawImage(im, x, s.top - w * 0.06, w, h);
  if (img.moss.width) g.drawImage(img.moss, s.x - cam - 13, s.top - 9, 26, 13);
}
function drawGuide() {
  // where she'd land if she let go now: a dotted 45-degree line
  if (candi.mode !== 'fly' && candi.mode !== 'drift') return;
  if (hops >= 2) return;
  g.save(); g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 3; g.setLineDash([2, 9]); g.lineCap = 'round';
  g.beginPath(); g.moveTo(candi.x - cam, candi.y); g.lineTo(candi.x - cam + 400, candi.y + 400); g.stroke(); g.restore();
}
function drawHint() {
  if (!hint || ended) return;
  const pulse = 1 + Math.sin(t / 22) * 0.04, y = H * 0.22;
  g.save(); g.translate(W / 2, y); g.scale(pulse, pulse);
  g.font = '900 28px "Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif'; g.textAlign = 'center'; g.lineJoin = 'round';
  const txt = hint === 'hold' ? 'HOLD TO FLOAT' : 'LET GO TO HOP!';
  g.lineWidth = 7; g.strokeStyle = '#8a1d5a'; g.strokeText(txt, 0, 0); g.fillStyle = '#fff'; g.fillText(txt, 0, 0);
  g.restore();
  if (hint === 'hold') { // a finger pressing
    const fy = H * 0.34, fx0 = W / 2, k = (t % 100) / 100;
    g.save(); g.strokeStyle = '#fff'; g.lineWidth = 4;
    g.globalAlpha = .8 * (1 - k); g.beginPath(); g.arc(fx0, fy, 14 + k * 26, 0, Math.PI * 2); g.stroke();
    g.globalAlpha = 1; g.font = '44px sans-serif'; g.textAlign = 'center'; g.fillText('\u{1F446}', fx0 + 6, fy + 40 + Math.sin(t / 24) * 3); g.restore();
  }
}
function draw() {
  g.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  const sky = img.sky;
  g.fillStyle = '#9ad'; g.fillRect(0, 0, W, H);
  if (sky.width) { const k = Math.max(W / sky.width, H / sky.height), w = sky.width * k, h = sky.height * k; g.drawImage(sky, (W - w) / 2, 0, w, h); }   // cover, never stretched (the moon stays round)
  cover(img.trees, H * 0.30, H * 0.56, 0.35);
  for (const s of stumps) if (s.x - cam > -80 && s.x - cam < W + 80) drawStump(s);
  const wg = g.createLinearGradient(0, WATER(), 0, H); wg.addColorStop(0, 'rgba(74,140,128,.92)'); wg.addColorStop(1, 'rgba(22,58,58,.98)');
  drawGuide();
  drawCandi();
  g.fillStyle = wg; g.fillRect(0, WATER(), W, H - WATER());
  g.fillStyle = 'rgba(255,255,255,.25)'; for (let x = -((cam * 1.1 + t * .4) % 40); x < W; x += 40) g.fillRect(x, WATER() + 3 + Math.sin((x + t) / 30) * 2, 18, 2);
  cover(img.reeds, H - H * 0.13, H * 0.13, 1.2);
  for (const p of fx) { g.globalAlpha = Math.min(1, p.life / 20); g.fillStyle = p.c; g.beginPath(); g.arc(p.x - cam, p.y, 2.6, 0, Math.PI * 2); g.fill(); }
  g.globalAlpha = 1;
  g.textAlign = 'center'; g.lineJoin = 'round';
  for (const p of popups) { g.globalAlpha = Math.min(1, p.life / 20); g.font = '900 24px "Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif'; g.lineWidth = 5; g.strokeStyle = 'rgba(60,10,40,.8)'; g.strokeText(p.txt, p.x - cam, p.y); g.fillStyle = p.c; g.fillText(p.txt, p.x - cam, p.y); }
  g.globalAlpha = 1;
  // score
  g.font = '900 40px "Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif'; g.lineWidth = 7; g.strokeStyle = '#8a1d5a';
  g.strokeText(String(score), W / 2, 62); g.fillStyle = '#fff'; g.fillText(String(score), W / 2, 62);
  drawHint();
}
// the rules run at a steady 60 steps a second, so a 120 Hz phone plays at the same speed as any other
let last = 0, acc = 0;
function loop(now) {
  if (!last) last = now;
  acc = Math.min(acc + (now - last), 250); last = now;
  let prev = null;
  while (acc >= 1000 / 60) { prev = { x: candi.x, y: candi.y, cam }; step(); acc -= 1000 / 60; }
  // draw between the last two steps, so a 120 Hz screen (iPhone) moves smoothly instead of every other frame
  if (prev) blend = prev;
  const a = acc / (1000 / 60), keep = { x: candi.x, y: candi.y, cam };
  if (blend) { candi.x = blend.x + (keep.x - blend.x) * a; candi.y = blend.y + (keep.y - blend.y) * a; cam = blend.cam + (keep.cam - blend.cam) * a; }
  draw();
  candi.x = keep.x; candi.y = keep.y; cam = keep.cam;
  requestAnimationFrame(loop);
}
let blend = null;
const verEl = document.getElementById('ver'), BUILD = verEl.textContent;   // the build tag (hidden; it's in the page for telling versions apart)
</script>
