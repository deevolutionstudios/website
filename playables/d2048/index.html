    popups.push({ x: cellX(s.c) + CS / 2, y: cellY(s.r) + 8, txt: '+500 GOLD', life: 80 });
    for (let i = 0; i < 16; i++) { const an = Math.random() * 6.28, sp = 0.8 + Math.random() * 1.8; fx.push({ x: cellX(s.c) + CS / 2, y: cellY(s.r) + CS / 2, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: 44, c: ['#ffd45c', '#fff', '#ff9a3c'][i % 3] }); }

}
function finish() {
  if (ended) return; ended = true;
  document.getElementById('endgold').textContent = gold ? `You looted ${gold.toLocaleString('en')} gold!` : '';
  document.getElementById('end').classList.add('on');
  send('complete', { score: gold });
}

// ---- input: swipe (or arrow keys); tap the sword
let sx = 0, sy = 0, down = false;
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); unlock(); if (ended) return;
  const p = toLogical(e); sx = p.x; sy = p.y; down = true;
  const sb = swordBox(); if (p.x > sb.x && p.x < sb.x + sb.s && p.y > sb.y && p.y < sb.y + sb.s) { down = false; useSword(); }
  else { const s = tiles.find(o => o.v === 's'); if (s && p.x > cellX(s.c) && p.x < cellX(s.c) + CS && p.y > cellY(s.r) && p.y < cellY(s.r) + CS) { down = false; useSword(); } }
});
addEventListener('pointerup', e => {
  if (!down) return; down = false;
  const p = toLogical(e), dx = p.x - sx, dy = p.y - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));

addEventListener('keydown', e => { const d = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[e.key]; if (d) { unlock(); move(d); } });
function toLogical(e) { return { x: e.clientX / scale, y: e.clientY / scale }; }
const swordBox = () => ({ x: W / 2 - 40, y: BY + BS + 26, s: 80 });
document.getElementById('cta').addEventListener('click', e => { e.stopPropagation(); cta(); });
document.getElementById('end').addEventListener('click', cta);

// ---- drawing
function step() {
  t++; idleT++;
  for (const o of tiles) { if (!isFinite(o.x) || !isFinite(o.y)) { o.x = cellX(o.c); o.y = cellY(o.r); }
    o.x += (cellX(o.c) - o.x) * 0.24; o.y += (cellY(o.r) - o.y) * 0.24; o.pop += (1 - o.pop) * 0.12; }
  shownGold += (gold - shownGold) * 0.12; if (Math.abs(gold - shownGold) < 1) shownGold = gold;
  fx = fx.filter(p => (p.x += p.vx, p.y += p.vy, p.vy += 0.03, --p.life > 0));
  popups = popups.filter(p => (p.y -= 0.35, --p.life > 0));
  if (slash && --slash.life <= 0) slash = null;
  if (!ended && started && idleT > 60 * 12) finish();
  if (!started && t > 60 * 15) finish();
}
function text(s, x, y, size, fill, stroke) {
  g.font = `900 ${size}px "Trebuchet MS",Arial,sans-serif`; g.textAlign = 'center'; g.lineJoin = 'round';
  g.lineWidth = Math.max(4, size / 5); g.strokeStyle = stroke || '#2a0d3a'; g.strokeText(s, x, y); g.fillStyle = fill || '#fff'; g.fillText(s, x, y);
}
function draw() {
  g.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  const bg = img.bg;
  if (bg.width) { const h = Math.max(H, W * bg.height / bg.width), w = h * bg.width / bg.height; g.drawImage(bg, (W - w) / 2, (H - h) / 2, w, h); }
  g.fillStyle = 'rgba(10,4,18,.35)'; g.fillRect(0, 0, W, H);
  // gold counter
  // what it is, at a glance: 2048, in a dungeon
  { const ty = Math.max(56, BY - 120), a = '2048 ', b = 'IN A DUNGEON!';
    g.font = '900 26px "Trebuchet MS",Arial,sans-serif'; const wa = g.measureText(a).width, wb = g.measureText(b).width, x0 = W / 2 - (wa + wb) / 2;
    g.textAlign = 'left'; g.lineJoin = 'round'; g.lineWidth = 6; g.strokeStyle = '#2a0d3a';
    g.strokeText(a, x0, ty); g.fillStyle = '#fff'; g.fillText(a, x0, ty);
    g.strokeText(b, x0 + wa, ty); g.fillStyle = '#ff9a3c'; g.fillText(b, x0 + wa, ty); g.textAlign = 'center'; }
  // gold: D2048's own coin with the count beside it, the pair centred, a little above the hint
  { const gy = Math.max(110, BY - 64), str = Math.round(shownGold).toLocaleString('en'), cs = 36;
    g.font = '900 30px "Trebuchet MS",Arial,sans-serif'; const tw = g.measureText(str).width, x0 = W / 2 - (cs + 8 + tw) / 2;
    if (img.coin.width) g.drawImage(img.coin, x0, gy - cs + 6, cs, cs);
    g.textAlign = 'left'; g.lineJoin = 'round'; g.lineWidth = 6; g.strokeStyle = '#2a0d3a'; g.strokeText(str, x0 + cs + 8, gy); g.fillStyle = '#ffd45c'; g.fillText(str, x0 + cs + 8, gy); g.textAlign = 'center'; }
  // board
  if (img.frame.width) g.drawImage(img.frame, BX - 6, BY - 6, BS + 12, BS + 12);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (img.cell.width) g.drawImage(img.cell, cellX(c) + 2, cellY(r) + 2, CS - 4, CS - 4);
  for (const o of tiles) {
    const im = typeof o.v === 'number' ? img['t' + o.v] : o.v === 's' ? img.skel : img.chest;
    if (!im || !im.width) continue;
    const s = CS * 0.92 * o.pop, cx = o.x + CS / 2, cy = o.y + CS / 2 + (o.v === 's' ? Math.sin(t / 28) * 1.5 : 0);
    g.globalAlpha = o.gone ? 0.5 : 1; g.drawImage(im, cx - s / 2, cy - s / 2, s, s); g.globalAlpha = 1;
  }
  // sword button
  const sb = swordBox();
  g.save(); g.translate(sb.x + sb.s / 2, sb.y + sb.s / 2);
  if (swordGlow) { const k = 1 + Math.sin(t / 16) * 0.06; g.scale(k, k); g.shadowColor = '#ffcf3f'; g.shadowBlur = 24; }
  if (img.sword.width && !slash && !tiles.some(o => o.v === 'c')) g.drawImage(img.sword, -sb.s / 2, -sb.s / 2, sb.s, sb.s);   // gone once it's swung
  g.restore();
  // the sword: flies up from its button (frames 48-34), then swings down across the skeleton (33-14) leaving a trail
  if (slash && img.sword.width) {
    const f = 48 - slash.life, sz = CS * 1.35;
    const fly = Math.min(1, f / 14), e = fly * fly * (3 - 2 * fly);
    const swing = Math.max(0, Math.min(1, (f - 14) / 16)), se = 1 - Math.pow(1 - swing, 3);
    // the hilt rests above and to the right of the skeleton; the blade sweeps from pointing up-right down across it
    const hx = slash.x + CS * 0.42, hy = slash.y - CS * 0.5;
    const px = slash.fx + (hx - slash.fx) * e, py = slash.fy + (hy - slash.fy) * e;
    const a = 0.5 + (-2.45 - 0.5) * se;   // the blade's direction: 0 = straight up, clockwise positive
    const fade = slash.life < 12 ? slash.life / 12 : 1;
    if (swing > 0 && swing < 1) { // the trail of the swing
      g.save(); g.globalAlpha = 0.5 * fade; g.strokeStyle = '#fff'; g.lineWidth = 8; g.lineCap = 'round';
      g.beginPath(); g.arc(px, py, sz * 0.8, a - Math.PI / 2, 0.5 - Math.PI / 2); g.stroke(); g.restore();
    }
    // the sword picture's blade points up and to the right, so turn it back by 45 degrees; the hilt sits at the pivot
    g.save(); g.globalAlpha = fade; g.translate(px, py); g.rotate(a - Math.PI / 4);
    g.drawImage(img.sword, -sz * 0.18, -sz * 0.82, sz, sz); g.restore();
  }
  for (const p of fx) { g.globalAlpha = Math.min(1, p.life / 16); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, 2.8, 0, 6.29); g.fill(); }
  g.globalAlpha = 1;
  for (const p of popups) { g.globalAlpha = Math.min(1, p.life / 20); text(p.txt, p.x, p.y, p.red ? 18 : 18, p.red ? '#ff8a8a' : '#ffd45c'); }
  g.globalAlpha = 1;
  // hints: the title over the board, the finger showing the swipe slowly, dots for the four swipes
  const hy = BY - 26;
  if (hint === 'swipe' && t >= hintAt) {
    text('SWIPE TO MERGE', W / 2, hy, 24);
    for (let i = 0; i < SWIPES; i++) { g.fillStyle = i < moves ? '#ffd45c' : 'rgba(255,255,255,.35)'; g.beginPath(); g.arc(W / 2 + (i - 1.5) * 16, hy + 16, 4.5, 0, 6.29); g.fill(); }
    // one slow stroke every 2.4 s: fade in, glide across the middle of the board, fade out, rest
    const P = 144, k = ((t - hintAt) % P) / P, glide = Math.min(1, Math.max(0, (k - 0.12) / 0.5)), ease = glide * glide * (3 - 2 * glide);
    const a = k < 0.12 ? k / 0.12 : k < 0.62 ? 1 : k < 0.76 ? 1 - (k - 0.62) / 0.14 : 0;
    const v = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[hintDir], span = BS * 0.28;
    const cx = BX + BS / 2, cy = BY + BS / 2, hx = cx - v[0] * span + v[0] * 2 * span * ease, hyy = cy - v[1] * span + v[1] * 2 * span * ease;
    if (a > 0) {
      g.save(); g.globalAlpha = a * 0.35; g.strokeStyle = '#fff'; g.lineWidth = 8; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx - v[0] * span, cy - v[1] * span); g.lineTo(hx, hyy); g.stroke();
      g.globalAlpha = a; g.font = '44px sans-serif'; g.textAlign = 'center'; g.fillText('\u{1F446}', hx + 6, hyy + 38); g.restore();
    }
  } else if (hint === 'sword' && t >= hintAt) {
    text('TAP THE SWORD!', W / 2, hy, 24, '#fff', '#5a0b0b');
    g.save(); g.globalAlpha = Math.min(1, (t - hintAt) / 20); g.font = '40px sans-serif'; g.textAlign = 'center';
    g.fillText('\u{1F446}', sb.x + sb.s / 2 + 8, sb.y + sb.s + 34 + Math.sin(t / 30) * 3); g.restore();
  }
}
// the rules run at a steady 60 steps a second, so a 120 Hz phone plays at the same speed as any other
let last = 0, acc = 0;
function loop(now) {
  if (!last) last = now;
  acc = Math.min(acc + (now - last), 250); last = now;
  let prev = null;
  while (acc >= 1000 / 60) { prev = new Map(tiles.map(o => [o, [o.x, o.y]])); step(); acc -= 1000 / 60; }
  // draw between the last two steps, so a 120 Hz screen (iPhone) moves smoothly instead of every other frame
  if (prev) blend = prev;
  const a = acc / (1000 / 60), keep = new Map(tiles.map(o => [o, [o.x, o.y]]));
  if (blend) for (const o of tiles) { const p = blend.get(o); if (p && isFinite(p[0])) { o.x = p[0] + (o.x - p[0]) * a; o.y = p[1] + (o.y - p[1]) * a; } }
  draw(); fpsCount++;
  if (now - fpsAt >= 1000) { verEl.textContent = BUILD + ' · ' + fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
  for (const [o, p] of keep) { o.x = p[0]; o.y = p[1]; }
  requestAnimationFrame(loop);
}
let blend = null, fpsCount = 0, fpsAt = 0;
const verEl = document.getElementById('ver'), BUILD = verEl.textContent;   // the build tag, then frames drawn per second (for testing)
</script>
