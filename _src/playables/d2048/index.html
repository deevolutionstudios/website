<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="ad.orientation" content="portrait">
<meta name="ad.size" content="width=320,height=480">
<title>D2048: Merge Dungeon</title>
<!--NETWORK-->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#140c1c;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%}
  #end{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;
    background:radial-gradient(circle at 50% 38%,rgba(170,70,255,.35),rgba(12,6,20,.9) 70%);font-family:'Trebuchet MS',Arial,sans-serif;color:#fff;text-align:center}
  #end.on{display:flex;animation:fade .35s ease-out}
  #end img.logo{width:min(88vw,380px);filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));animation:bob 2s ease-in-out infinite}
  #end .line{font-size:clamp(17px,5vw,22px);font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.5)}
  #end .sub2{font-size:clamp(14px,4vw,17px);opacity:.9;max-width:320px}
  #end .gold{font-size:clamp(15px,4.4vw,19px);color:#ffd45c;font-weight:800}
  #end button{margin-top:6px;border:3px solid #ffe08a;border-radius:16px;background:linear-gradient(#ffcf3f,#e88a00);color:#3a1600;font:900 clamp(20px,6.2vw,26px)/1 'Trebuchet MS',Arial,sans-serif;
    padding:16px 40px;box-shadow:0 6px 0 #8a4a00,0 10px 22px rgba(0,0,0,.45);animation:pulse 1.1s ease-in-out infinite;cursor:pointer}
  #end .sub{font-size:13px;opacity:.8}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes bob{50%{transform:translateY(-6px)}}
  @keyframes pulse{50%{transform:scale(1.07)}}
  @media (prefers-reduced-motion:reduce){#end img.logo,#end button{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ver" style="position:fixed;left:6px;bottom:4px;font:10px/1 monospace;color:#fff;opacity:.35;pointer-events:none">/*BUILD*/</div>
<div id="end">
  <img class="logo" id="endlogo" alt="D2048">
  <div class="line">The 2048 you love,<br>gone dungeon crawling!</div>
  <div class="sub2">Merge treasure. Slay monsters. 60 levels and a dragon.</div>
  <div class="gold" id="endgold"></div>
  <button id="cta" type="button">PLAY FREE</button>
  <div class="sub">Free on iPhone and Android</div>
</div>
<script>
// D2048 playable ad (De-Evolution Studios). One file: the art is inlined by tools/build-playables.js.
// Shown inside our own games (house ads) and usable on ad networks (MRAID / Google's ExitApi).
// Host games talk to it with postMessage: it sends {dvsAd: 'ready'|'start'|'complete'|'cta', game} to its parent.
const GAME = 'd2048';
const STORE = { ios: 'https://apps.apple.com/app/id1354589124', android: 'https://play.google.com/store/apps/details?id=com.deevolutionstudios.d2048', web: 'https://deevolutionstudios.com/d2048/' };
const A = /*ASSETS*/{};
const Q = new URLSearchParams(location.search);
const hosted = window.parent !== window;
const platform = Q.get('platform') || (/iPhone|iPad|iPod/.test(navigator.userAgent) ? 'ios' : /Android/.test(navigator.userAgent) ? 'android' : 'web');
let soundOn = Q.get('sound') !== '0';
const send = (type, extra) => { try { if (hosted) parent.postMessage(Object.assign({ dvsAd: type, game: GAME }, extra || {}), '*'); } catch (e) {} };
function cta() {
  send('cta', { platform });
  if (window.mraid && mraid.open) mraid.open(STORE[platform] || STORE.android);
  else if (window.ExitApi && ExitApi.exit) ExitApi.exit();
  else if (!hosted) window.open(STORE[platform] || STORE.web, '_blank');
}
const src = k => A[k] || ('assets/' + k);
const img = {}; let left = 0, begun = false;   // begun: start once, even if a picture comes back early
function load(k) { left++; const i = new Image(); i.onload = i.onerror = () => { if (--left === 0 && !begun) { begun = true; start(); } }; i.src = src(k + '.webp'); img[k] = i; }
['bg', 'frame', 'cell', 'skel', 'chest', 'sword', 'coin', 't1', 't2', 't3', 't4', 't5', 't6', 't7', 't8', 't9'].forEach(load);
document.getElementById('endlogo').src = src('logo.webp');

let ac = null; const buf = {};
function unlock() {
  if (ac || !soundOn) return;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  ['coin', 'appear', 'slay', 'explode'].forEach(k => fetch(src(k + '.mp3')).then(r => r.arrayBuffer()).then(b => ac.decodeAudioData(b)).then(d => { buf[k] = d; }).catch(() => {}));
}
function play(k, vol) { if (!ac || !buf[k] || !soundOn) return; const s = ac.createBufferSource(), g = ac.createGain(); g.gain.value = vol || 0.6; s.buffer = buf[k]; s.connect(g).connect(ac.destination); s.start(); }
window.addEventListener('message', e => { const d = e.data || {}; if (d.dvsAd === 'sound') soundOn = !!d.on; });

// ---- layout, in logical pixels 360 wide
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W = 360, H = 640, scale = 1, dpr = 1, BX = 12, BY = 150, BS = 336, CS = 75;
function fit() {
  if (!innerWidth || !innerHeight) return;   // a frame not laid out yet: wait for its resize
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = innerWidth / 360; W = 360; H = innerHeight / scale;
  if (H < 560) { scale = innerHeight / 560; H = 560; W = innerWidth / scale; }
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  BS = Math.min(W - 24, 340); BX = (W - BS) / 2; BY = Math.max(180, H * 0.27); CS = (BS - 36) / 4;
}
addEventListener('resize', fit); fit();
const cellX = c => BX + 18 + c * CS, cellY = r => BY + 18 + r * CS;

// ---- the board: tiles {id, v (1-9 treasure, 's' skeleton, 'c' chest), r, c, x, y, pop}
// The flow (Richard, Nov 5: clean and calm): four guided swipes, the finger showing each one, then the skeleton and the sword.
const SWIPES = 4;
let tiles = [], nextId = 1, moves = 0, gold = 0, shownGold = 0, t = 0, state = 'load', hint = null, hintAt = 30, hintDir = 'left',
  started = false, ended = false, idleT = 0, fx = [], popups = [], swordGlow = false, slash = null, busy = false;
const add = (v, r, c, pop) => { const o = { id: nextId++, v, r, c, x: cellX(c), y: cellY(r), pop: pop ? 0.4 : 1 }; tiles.push(o); return o; };
const at = (list, r, c) => list.find(o => o.r === r && o.c === c && !o.gone);
function start() {
  // a board with pairs to merge in every direction
  [[0, 0, 1], [0, 2, 1], [1, 1, 2], [1, 3, 2], [2, 0, 3], [2, 1, 3], [3, 2, 4], [0, 3, 5]].forEach(([r, c, v]) => add(v, r, c));
  hintDir = bestDir(); hint = 'swipe';
  state = 'play'; send('ready'); requestAnimationFrame(loop);
}
const SPAWNS = [[3, 3], [2, 3], [1, 3], [3, 0], [0, 3], [2, 2], [3, 1], [1, 2]];
function spawn(v) {
  for (const [r, c] of SPAWNS) if (!at(tiles, r, c)) return add(v, r, c, true);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!at(tiles, r, c)) return add(v, r, c, true);
}
// slides one list of tiles (changes them); returns whether anything moved and where merges landed
function slide(list, dir) {
  const dr = { up: -1, down: 1, left: 0, right: 0 }[dir], dc = { left: -1, right: 1, up: 0, down: 0 }[dir];
  const order = [0, 1, 2, 3]; if (dr > 0 || dc > 0) order.reverse();
  let moved = false; const merges = [], done = new Set();
  for (const a of order) for (const b of order) {
    const r = dr ? a : b, c = dc ? a : b, o = at(list, r, c); if (!o) continue;
    let nr = r, nc = c, merged = false;
    while (true) {
      const tr = nr + dr, tc = nc + dc; if (tr < 0 || tr > 3 || tc < 0 || tc > 3) break;
      const there = at(list, tr, tc);
      if (!there) { nr = tr; nc = tc; continue; }
      if (typeof o.v === 'number' && there.v === o.v && o.v < 9 && !done.has(there.id)) {
        o.gone = true; o.r = tr; o.c = tc; there.v++; done.add(there.id); merges.push(there); moved = merged = true;
      }
      break;
    }
    if (!merged && (nr !== r || nc !== c)) { o.r = nr; o.c = nc; moved = true; }
  }
  return { moved, merges };
}
// the swipe that merges the most right now (the finger shows it)
function bestDir() {
  let best = 'left', most = -1;
  for (const d of ['left', 'up', 'right', 'down']) {
    const r = slide(tiles.filter(o => !o.gone).map(o => ({ ...o })), d);
    if (r.moved && r.merges.length > most) { most = r.merges.length; best = d; }
  }
  return best;
}
const mergesFor = d => { const r = slide(tiles.filter(o => !o.gone).map(o => ({ ...o })), d); return r.moved ? r.merges.length : 0; };
// a new coin where the next swipe will merge something (every guided swipe merges: Richard, Nov 5)
function spawnMerging() {
  const free = []; for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!at(tiles, r, c)) free.push([r, c]);
  const kinds = [...new Set(tiles.filter(o => typeof o.v === 'number' && o.v < 9).map(o => o.v))].sort((a, b) => a - b);
  let best = null, most = 0;
  for (const v of kinds.length ? kinds : [1]) for (const [r, c] of free) {
    const o = add(v, r, c, true);
    const m = Math.max(...['left', 'up', 'right', 'down'].map(mergesFor));
    tiles.pop();
    if (m > most) { most = m; best = [v, r, c]; }
  }
  if (best) return add(best[0], best[1], best[2], true);
  return spawn(1);
}
function bump() { for (const o of tiles) o.pop = 0.94; }   // a swipe that merges nothing: the coins only flinch
function move(dir) {
  if (ended || state !== 'play' || busy || moves >= SWIPES) return;
  if (mergesFor(dir) === 0) { bump(); return; }
  const r = slide(tiles, dir);
  if (!r.moved) return;
  if (!started) { started = true; send('start'); }
  idleT = 0; moves++; hint = null; busy = true;
  for (const m of r.merges) {
    m.pop = 1.12; const g2 = 5 * Math.pow(2, m.v); gold += g2;
    popups.push({ x: cellX(m.c) + CS / 2, y: cellY(m.r) + 8, txt: '+' + g2, life: 46 });
    for (let i = 0; i < 6; i++) { const an = Math.random() * 6.28, sp = 0.6 + Math.random() * 1.2; fx.push({ x: cellX(m.c) + CS / 2, y: cellY(m.r) + CS / 2, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: 34, c: ['#ffd45c', '#fff2b0'][i % 2] }); }
  }
  if (r.merges.length) play('coin', 0.5);
  setTimeout(() => {
    tiles = tiles.filter(o => !o.gone);
    if (moves >= SWIPES) {
      setTimeout(() => {   // a moment's calm, then the skeleton steps out
        const s = spawn('s'); s.pop = 0.4; play('appear', 0.45); swordGlow = true; busy = false;
        popups.push({ x: cellX(s.c) + CS / 2, y: cellY(s.r) + 4, txt: 'A SKELETON!', life: 90, red: true });
        hint = 'sword'; hintAt = t + 40;
      }, 450);
      return;
    }
    spawnMerging();
    busy = false; hintDir = bestDir(); hint = 'swipe'; hintAt = t + 35;   // the finger comes back after a short pause
  }, 220);
}
function useSword() {
  const s = tiles.find(o => o.v === 's'); if (!s || slash) return;
  swordGlow = false; hint = null; idleT = 0;
  const sb0 = swordBox(); slash = { x: cellX(s.c) + CS / 2, y: cellY(s.r) + CS / 2, fx: sb0.x + sb0.s / 2, fy: sb0.y + sb0.s / 2, life: 48 };
  play('slay', 0.55);
  setTimeout(() => {
    s.v = 'c'; s.pop = 1.15; gold += 500; play('explode', 0.5);
    popups.push({ x: cellX(s.c) + CS / 2, y: cellY(s.r) + 8, txt: '+500 GOLD', life: 80 });
    for (let i = 0; i < 16; i++) { const an = Math.random() * 6.28, sp = 0.8 + Math.random() * 1.8; fx.push({ x: cellX(s.c) + CS / 2, y: cellY(s.r) + CS / 2, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: 44, c: ['#ffd45c', '#fff', '#ff9a3c'][i % 3] }); }
    setTimeout(finish, 1600);
  }, 500);
}
function finish() {
  if (ended) return; ended = true;
  document.getElementById('endgold').textContent = gold ? `You looted ${gold.toLocaleString('en')} gold!` : '';
  document.getElementById('end').classList.add('on');
  send('complete', { score: gold });
}

// ---- input: swipe (or arrow keys); tap the sword
let sx = 0, sy = 0, down = false;
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); unlock(); if (ended) return;
  const p = toLogical(e); sx = p.x; sy = p.y; down = true;
  const sb = swordBox(); if (p.x > sb.x && p.x < sb.x + sb.s && p.y > sb.y && p.y < sb.y + sb.s) { down = false; useSword(); }
  else { const s = tiles.find(o => o.v === 's'); if (s && p.x > cellX(s.c) && p.x < cellX(s.c) + CS && p.y > cellY(s.r) && p.y < cellY(s.r) + CS) { down = false; useSword(); } }
});
addEventListener('pointerup', e => {
  if (!down) return; down = false;
  const p = toLogical(e), dx = p.x - sx, dy = p.y - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
addEventListener('keydown', e => { const d = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[e.key]; if (d) { unlock(); move(d); } });
function toLogical(e) { return { x: e.clientX / scale, y: e.clientY / scale }; }
const swordBox = () => ({ x: W / 2 - 40, y: BY + BS + 26, s: 80 });
document.getElementById('cta').addEventListener('click', e => { e.stopPropagation(); cta(); });
document.getElementById('end').addEventListener('click', cta);

// ---- drawing
function step() {
  t++; idleT++;
  for (const o of tiles) { if (!isFinite(o.x) || !isFinite(o.y)) { o.x = cellX(o.c); o.y = cellY(o.r); }
    o.x += (cellX(o.c) - o.x) * 0.24; o.y += (cellY(o.r) - o.y) * 0.24; o.pop += (1 - o.pop) * 0.12; }
  shownGold += (gold - shownGold) * 0.12; if (Math.abs(gold - shownGold) < 1) shownGold = gold;
  fx = fx.filter(p => (p.x += p.vx, p.y += p.vy, p.vy += 0.03, --p.life > 0));
  popups = popups.filter(p => (p.y -= 0.35, --p.life > 0));
  if (slash && --slash.life <= 0) slash = null;
  if (!ended && started && idleT > 60 * 12) finish();
  if (!started && t > 60 * 15) finish();
}
function text(s, x, y, size, fill, stroke) {
  g.font = `900 ${size}px "Trebuchet MS",Arial,sans-serif`; g.textAlign = 'center'; g.lineJoin = 'round';
  g.lineWidth = Math.max(4, size / 5); g.strokeStyle = stroke || '#2a0d3a'; g.strokeText(s, x, y); g.fillStyle = fill || '#fff'; g.fillText(s, x, y);
}
function draw() {
  g.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  const bg = img.bg;
  if (bg.width) { const h = Math.max(H, W * bg.height / bg.width), w = h * bg.width / bg.height; g.drawImage(bg, (W - w) / 2, (H - h) / 2, w, h); }
  g.fillStyle = 'rgba(10,4,18,.35)'; g.fillRect(0, 0, W, H);
  // gold counter
  // what it is, at a glance: 2048, in a dungeon
  { const ty = Math.max(40, BY - 146);
    text('2048', W / 2, ty, 34, '#fff', '#2a0d3a');
    text('...IN A DUNGEON!', W / 2, ty + 30, 20, '#ff9a3c', '#2a0d3a'); }
  // gold: D2048's own coin with the count beside it, the pair centred, a little above the hint
  { const gy = Math.max(110, BY - 64), str = Math.round(shownGold).toLocaleString('en'), cs = 36;
    g.font = '900 30px "Trebuchet MS",Arial,sans-serif'; const tw = g.measureText(str).width, x0 = W / 2 - (cs + 8 + tw) / 2;
    if (img.coin.width) g.drawImage(img.coin, x0, gy - cs + 6, cs, cs);
    g.textAlign = 'left'; g.lineJoin = 'round'; g.lineWidth = 6; g.strokeStyle = '#2a0d3a'; g.strokeText(str, x0 + cs + 8, gy); g.fillStyle = '#ffd45c'; g.fillText(str, x0 + cs + 8, gy); g.textAlign = 'center'; }
  // board
  if (img.frame.width) g.drawImage(img.frame, BX - 6, BY - 6, BS + 12, BS + 12);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (img.cell.width) g.drawImage(img.cell, cellX(c) + 2, cellY(r) + 2, CS - 4, CS - 4);
  for (const o of tiles) {
    const im = typeof o.v === 'number' ? img['t' + o.v] : o.v === 's' ? img.skel : img.chest;
    if (!im || !im.width) continue;
    const s = CS * 0.92 * o.pop, cx = o.x + CS / 2, cy = o.y + CS / 2 + (o.v === 's' ? Math.sin(t / 28) * 1.5 : 0);
    g.globalAlpha = o.gone ? 0.5 : 1; g.drawImage(im, cx - s / 2, cy - s / 2, s, s); g.globalAlpha = 1;
  }
  // sword button
  const sb = swordBox();
  g.save(); g.translate(sb.x + sb.s / 2, sb.y + sb.s / 2);
  if (swordGlow) { const k = 1 + Math.sin(t / 16) * 0.06; g.scale(k, k); g.shadowColor = '#ffcf3f'; g.shadowBlur = 24; }
  if (img.sword.width && !slash && !tiles.some(o => o.v === 'c')) g.drawImage(img.sword, -sb.s / 2, -sb.s / 2, sb.s, sb.s);   // gone once it's swung
  g.restore();
  // the sword: flies up from its button (frames 48-34), then swings down across the skeleton (33-14) leaving a trail
  if (slash && img.sword.width) {
    const f = 48 - slash.life, sz = CS * 1.35;
    const fly = Math.min(1, f / 14), e = fly * fly * (3 - 2 * fly);
    const swing = Math.max(0, Math.min(1, (f - 14) / 16)), se = 1 - Math.pow(1 - swing, 3);
    // the hilt rests above and to the right of the skeleton; the blade sweeps from pointing up-right down across it
    const hx = slash.x + CS * 0.42, hy = slash.y - CS * 0.5;
    const px = slash.fx + (hx - slash.fx) * e, py = slash.fy + (hy - slash.fy) * e;
    const a = 0.5 + (-2.45 - 0.5) * se;   // the blade's direction: 0 = straight up, clockwise positive
    const fade = slash.life < 12 ? slash.life / 12 : 1;
    if (swing > 0 && swing < 1) { // the trail of the swing
      g.save(); g.globalAlpha = 0.5 * fade; g.strokeStyle = '#fff'; g.lineWidth = 8; g.lineCap = 'round';
      g.beginPath(); g.arc(px, py, sz * 0.8, a - Math.PI / 2, 0.5 - Math.PI / 2); g.stroke(); g.restore();
    }
    // the sword picture's blade points up and to the right, so turn it back by 45 degrees; the hilt sits at the pivot
    g.save(); g.globalAlpha = fade; g.translate(px, py); g.rotate(a - Math.PI / 4);
    g.drawImage(img.sword, -sz * 0.18, -sz * 0.82, sz, sz); g.restore();
  }
  for (const p of fx) { g.globalAlpha = Math.min(1, p.life / 16); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, 2.8, 0, 6.29); g.fill(); }
  g.globalAlpha = 1;
  for (const p of popups) { g.globalAlpha = Math.min(1, p.life / 20); text(p.txt, p.x, p.y, p.red ? 18 : 18, p.red ? '#ff8a8a' : '#ffd45c'); }
  g.globalAlpha = 1;
  // hints: the title over the board, the finger showing the swipe slowly, dots for the four swipes
  const hy = BY - 26;
  if (hint === 'swipe' && t >= hintAt) {
    text('SWIPE TO MERGE', W / 2, hy, 24);
    for (let i = 0; i < SWIPES; i++) { g.fillStyle = i < moves ? '#ffd45c' : 'rgba(255,255,255,.35)'; g.beginPath(); g.arc(W / 2 + (i - 1.5) * 16, hy + 16, 4.5, 0, 6.29); g.fill(); }
    // one slow stroke every 2.4 s: fade in, glide across the middle of the board, fade out, rest
    const P = 144, k = ((t - hintAt) % P) / P, glide = Math.min(1, Math.max(0, (k - 0.12) / 0.5)), ease = glide * glide * (3 - 2 * glide);
    const a = k < 0.12 ? k / 0.12 : k < 0.62 ? 1 : k < 0.76 ? 1 - (k - 0.62) / 0.14 : 0;
    const v = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[hintDir], span = BS * 0.28;
    const cx = BX + BS / 2, cy = BY + BS / 2, hx = cx - v[0] * span + v[0] * 2 * span * ease, hyy = cy - v[1] * span + v[1] * 2 * span * ease;
    if (a > 0) {
      g.save(); g.globalAlpha = a * 0.35; g.strokeStyle = '#fff'; g.lineWidth = 8; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx - v[0] * span, cy - v[1] * span); g.lineTo(hx, hyy); g.stroke();
      g.globalAlpha = a; g.font = '44px sans-serif'; g.textAlign = 'center'; g.fillText('\u{1F446}', hx + 6, hyy + 38); g.restore();
    }
  } else if (hint === 'sword' && t >= hintAt) {
    text('TAP THE SWORD!', W / 2, hy, 24, '#fff', '#5a0b0b');
    g.save(); g.globalAlpha = Math.min(1, (t - hintAt) / 20); g.font = '40px sans-serif'; g.textAlign = 'center';
    g.fillText('\u{1F446}', sb.x + sb.s / 2 + 8, sb.y + sb.s + 34 + Math.sin(t / 30) * 3); g.restore();
  }
}
// the rules run at a steady 60 steps a second, so a 120 Hz phone plays at the same speed as any other
let last = 0, acc = 0;
function loop(now) {
  if (!last) last = now;
  acc = Math.min(acc + (now - last), 250); last = now;
  let prev = null;
  while (acc >= 1000 / 60) { prev = new Map(tiles.map(o => [o, [o.x, o.y]])); step(); acc -= 1000 / 60; }
  // draw between the last two steps, so a 120 Hz screen (iPhone) moves smoothly instead of every other frame
  if (prev) blend = prev;
  const a = acc / (1000 / 60), keep = new Map(tiles.map(o => [o, [o.x, o.y]]));
  if (blend) for (const o of tiles) { const p = blend.get(o); if (p && isFinite(p[0])) { o.x = p[0] + (o.x - p[0]) * a; o.y = p[1] + (o.y - p[1]) * a; } }
  draw(); fpsCount++;
  if (now - fpsAt >= 1000) { verEl.textContent = BUILD + ' · ' + fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
  for (const [o, p] of keep) { o.x = p[0]; o.y = p[1]; }
  requestAnimationFrame(loop);
}
let blend = null, fpsCount = 0, fpsAt = 0;
const verEl = document.getElementById('ver'), BUILD = verEl.textContent;   // the build tag, then frames drawn per second (for testing)
</script>
</body>
